name: Build and Release

# 发布入口（推荐）：Actions → Build and Release → Run workflow
#   bump 选 auto/patch/minor/major 自动推算版本号，或直接填 version 指定版本
# 兼容旧入口：git push origin vX.Y.Z 仍会构建并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: '版本递增方式（填写 version 时忽略此项）'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: '直接指定版本号，如 1.9.0（留空则按 bump 推算）'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  packages: write

# 同一时刻只允许一个发布任务：打 tag 与回写版本号不能并发
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # 发布一律基于 main 最新提交；tag 触发时构建该 tag
        ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
        # 需要完整 tag 历史来推算下一个版本号
        fetch-depth: 0

    - name: Require main branch for manual release
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
          echo "::error::请从 main 分支触发发布，当前为 ${GITHUB_REF_NAME}"
          exit 1
        fi

    # 版本号只在 tag 里维护：先算出版本，构建与打 tag 都基于同一个值
    - name: Compute version
      id: version
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
          # 旧路径：手动推的 tag 就是版本号
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "使用 tag 指定版本：${VERSION}"
        else
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ -z "${VERSION}" ]]; then
            LAST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            LAST_VERSION="${LAST_TAG#v}"
            LAST_VERSION="${LAST_VERSION%%-*}"
            LAST_VERSION="${LAST_VERSION:-0.0.0}"

            BUMP="${{ inputs.bump }}"
            if [[ "${BUMP}" == "auto" ]]; then
              if [[ -n "${LAST_TAG}" ]]; then
                LOG="$(git log --format='%s%n%b' "${LAST_TAG}..HEAD")"
              else
                LOG="$(git log --format='%s%n%b' -n 50)"
              fi
              if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"${LOG}" || grep -q 'BREAKING CHANGE' <<<"${LOG}"; then
                BUMP=major
              elif grep -qE '^feat(\([^)]*\))?:' <<<"${LOG}"; then
                BUMP=minor
              else
                BUMP=patch
              fi
              echo "按提交记录推断递增方式：${BUMP}（基准 ${LAST_VERSION}）"
            fi

            IFS=. read -r MAJOR MINOR PATCH <<<"${LAST_VERSION}"
            case "${BUMP}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              *) echo "::error::未知的递增方式：${BUMP}"; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
        fi

        if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::版本号不合法：${VERSION}"
          exit 1
        fi
        # 只有「本次要新建 tag」时才校验重复；tag 触发时该 tag 本来就在
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] \
          && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
          echo "::error::tag v${VERSION} 已存在，请换一个版本号"
          exit 1
        fi

        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "→ 本次发布版本：v${VERSION}"

    # version.go 只是默认值的落脚点，与 tag 保持同步，避免两处版本号漂移
    - name: Sync version into source
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        FILE="src/internal/version/version.go"
        sed -E -i "s|(^[[:space:]]*Version[[:space:]]*=[[:space:]]*)\"[^\"]*\"|\1\"${{ steps.version.outputs.version }}\"|" "${FILE}"
        grep -nE '^[[:space:]]*Version[[:space:]]*=' "${FILE}"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: src/go.mod
        cache-dependency-path: src/go.sum

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        # 与 web/pnpm-lock.yaml 的 lockfileVersion 9.0 对齐
        version: 9
        # v6 起 run_install 更名为 install
        install: false

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: src/web/pnpm-lock.yaml

    - name: Get build time
      id: build_time
      run: |
        BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"

    - name: Build for Linux
      run: |
        VERSION="${{ steps.version.outputs.version }}" \
        COMMIT="$(git rev-parse --short HEAD)" \
        BUILD_TIME="${{ steps.build_time.outputs.time }}" \
        ./build.sh

    # install.sh 从 Releases 下载固定文件名，这里额外产出这个别名
    - name: Prepare release asset aliases
      run: |
        cp dist/reality-checker-linux-amd64 dist/reality-checker-main
        ls -lh dist

    # GITHUB_TOKEN 打出的 tag 不会触发其它 workflow，所以构建、打 tag、
    # 发布必须在同一个 run 里做完，不能拆成「先打 tag 再等 tag 事件」。
    - name: Commit version bump and push tag
      if: github.event_name == 'workflow_dispatch'
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        git add src/internal/version/version.go
        if git diff --cached --quiet; then
          echo "版本号无变化，跳过提交"
        else
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main
        fi

        git tag "${{ steps.version.outputs.tag }}"
        git push origin "refs/tags/${{ steps.version.outputs.tag }}"
        echo "已推送 tag：${{ steps.version.outputs.tag }}"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: RealityChecker ${{ steps.version.outputs.tag }}
        # 更新说明由 GitHub 按 PR/提交自动生成，分类规则见 .github/release.yml
        generate_release_notes: true
        files: |
          src/dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 调试用产物，放在发布之后，避免它失败影响发版
    - name: Upload build artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: reality-checker-builds
        path: src/dist/
